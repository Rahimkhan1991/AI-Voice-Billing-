<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Business Setup - AI POS Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at top right, #f8fafc, #e2e8f0); }
        .custom-select-wrapper select { appearance: none; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="max-w-5xl w-full grid grid-cols-1 md:grid-cols-2 bg-white rounded-[3rem] shadow-2xl overflow-hidden border border-white">
        <div class="bg-slate-900 p-12 text-white flex flex-col justify-between relative">
            <div class="relative z-10">
                <div class="w-12 h-12 bg-indigo-500 rounded-2xl flex items-center justify-center mb-6 shadow-lg">
                    <i class="fa-solid fa-globe text-xl"></i>
                </div>
                <h1 class="text-3xl font-black mb-4">Global <span class="text-indigo-400">Onboarding</span></h1>
                <p class="text-slate-400 leading-relaxed text-sm">Configure your local currency and industry. Our AI engine will automatically adjust number formatting and tax structures based on your selection.</p>
            </div>
            <div class="mt-8 space-y-4 relative z-10">
                <div class="flex items-center gap-3 text-xs font-bold text-indigo-300 uppercase tracking-widest">
                    <i class="fa-solid fa-check-circle"></i> Supports 150+ Currencies
                </div>
                <div class="flex items-center gap-3 text-xs font-bold text-indigo-300 uppercase tracking-widest">
                    <i class="fa-solid fa-check-circle"></i> IDR (Rp) Specialized Formatting
                </div>
            </div>
            <div class="absolute -bottom-20 -left-20 w-64 h-64 bg-indigo-500/10 rounded-full blur-3xl"></div>
        </div>

        <div class="p-10 md:p-12 overflow-y-auto max-h-[90vh]">
            <h2 class="text-xl font-black text-slate-800 mb-6">Business Profile</h2>
            <form id="setupForm" class="space-y-4">
                <div>
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Business Name</label>
                    <input type="text" id="bizName" required class="w-full px-5 py-3 rounded-xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500 mt-1" placeholder="e.g. Toko Jaya Jakarta">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Industry</label>
                        <select id="bizIndustry" class="w-full px-5 py-3 rounded-xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500 mt-1">
                            <option>Retail & Grocery</option>
                            <option>Pharmacy</option>
                            <option>Hardware & Tools</option>
                            <option>Fashion</option>
                            <option>Electronics</option>
                            <option>Cafe/Restaurant</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Region/Currency</label>
                        <select id="bizCurrency" onchange="handleCurrencyChange(this.value)" class="w-full px-5 py-3 rounded-xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500 mt-1">
                            <option value="id-ID|IDR|Rp">Indonesia (Rp)</option>
                            <option value="en-US|USD|$">United States ($)</option>
                            <option value="en-IN|INR|₹">India (₹)</option>
                            <option value="en-GB|GBP|£">United Kingdom (£)</option>
                            <option value="de-DE|EUR|€">Europe (€)</option>
                            <option value="en-SG|SGD|S$">Singapore (S$)</option>
                            <option value="ar-SA|SAR|SR">Saudi Arabia (SR)</option>
                            <option value="ar-AE|AED|د.إ">UAE (د.إ)</option>
                            <option value="ja-JP|JPY|¥">Japan (¥)</option>
                            <option value="CUSTOM">-- Custom Currency --</option>
                        </select>
                    </div>
                </div>

                <div id="customCurrencyBox" class="hidden grid grid-cols-2 gap-4 p-4 bg-indigo-50 rounded-2xl">
                    <div>
                        <label class="text-[10px] font-black uppercase text-indigo-400">Symbol</label>
                        <input type="text" id="customSymbol" placeholder="e.g. KWD" class="w-full px-4 py-2 rounded-lg bg-white border-none mt-1">
                    </div>
                    <div>
                        <label class="text-[10px] font-black uppercase text-indigo-400">Locale Code</label>
                        <input type="text" id="customLocale" placeholder="e.g. en-KW" class="w-full px-4 py-2 rounded-lg bg-white border-none mt-1">
                    </div>
                </div>

                <div>
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Store Address</label>
                    <textarea id="bizAddress" rows="2" class="w-full px-5 py-3 rounded-xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500 mt-1" placeholder="Street, City, Country"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Contact No</label>
                        <input type="text" id="bizPhone" class="w-full px-5 py-3 rounded-xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500 mt-1">
                    </div>
                    <div>
                        <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Tax ID / NIB</label>
                        <input type="text" id="bizTax" class="w-full px-5 py-3 rounded-xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500 mt-1">
                    </div>
                </div>

                <button type="submit" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-xl hover:bg-indigo-700 transition transform active:scale-95 mt-4">
                    Launch My Store <i class="fa-solid fa-rocket ml-2"></i>
                </button>
            </form>
        </div>
    </div>

    <script>
        function handleCurrencyChange(val) {
            const box = document.getElementById('customCurrencyBox');
            box.classList.toggle('hidden', val !== 'CUSTOM');
        }

        document.getElementById('setupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            let locale, currencyCode, symbol;
            const selection = document.getElementById('bizCurrency').value;

            if(selection === 'CUSTOM') {
                locale = document.getElementById('customLocale').value || 'en-US';
                symbol = document.getElementById('customSymbol').value || '$';
                currencyCode = 'CUSTOM';
            } else {
                const parts = selection.split('|');
                locale = parts[0];
                currencyCode = parts[1];
                symbol = parts[2];
            }

            const bizData = {
                name: document.getElementById('bizName').value,
                industry: document.getElementById('bizIndustry').value,
                locale: locale,
                symbol: symbol,
                currencyCode: currencyCode,
                address: document.getElementById('bizAddress').value,
                phone: document.getElementById('bizPhone').value,
                tax: document.getElementById('bizTax').value,
                setupDate: new Date().toLocaleDateString()
            };

            localStorage.setItem('AI_POS_BIZ_DATA', JSON.stringify(bizData));
            window.location.href = 'index.html';
        });

        const existing = localStorage.getItem('AI_POS_BIZ_DATA');
        if(existing && !window.location.search.includes('edit=true')) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
