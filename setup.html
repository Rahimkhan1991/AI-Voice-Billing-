<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Setup - AI POS Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at top right, #f8fafc, #e2e8f0); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="max-w-4xl w-full grid grid-cols-1 md:grid-cols-2 bg-white rounded-[3rem] shadow-2xl overflow-hidden border border-white">
        <div class="bg-slate-900 p-12 text-white flex flex-col justify-between">
            <div>
                <div class="w-12 h-12 bg-indigo-500 rounded-2xl flex items-center justify-center mb-6 shadow-lg shadow-indigo-500/50">
                    <i class="fa-solid fa-rocket text-xl"></i>
                </div>
                <h1 class="text-3xl font-black mb-4">Welcome to <span class="text-indigo-400">AI-POS</span></h1>
                <p class="text-slate-400 leading-relaxed">Let's set up your digital storefront. This information will be used to brand your POS and generate professional invoices.</p>
            </div>
            <div class="text-[10px] font-bold uppercase tracking-widest text-slate-500">
                Powered by AI-POS Enterprise v2.0
            </div>
        </div>

        <div class="p-12">
            <h2 class="text-xl font-black text-slate-800 mb-8">Create Business Profile</h2>
            <form id="setupForm" class="space-y-4">
                <div>
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Business Name</label>
                    <input type="text" id="bizName" required class="w-full px-5 py-3 rounded-xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500 mt-1" placeholder="e.g. Metro Supermarket">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Industry</label>
                        <select id="bizIndustry" class="w-full px-5 py-3 rounded-xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500 mt-1">
                            <option>Retail & Grocery</option>
                            <option>Hardware & Tools</option>
                            <option>Pharmacy</option>
                            <option>Fashion & Apparel</option>
                            <option>Cafe & Food</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Currency</label>
                        <select id="bizCurrency" class="w-full px-5 py-3 rounded-xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500 mt-1">
                            <option value="$">USD ($)</option>
                            <option value="₹">INR (₹)</option>
                            <option value="£">GBP (£)</option>
                            <option value="€">EUR (€)</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Store Address</label>
                    <textarea id="bizAddress" rows="2" class="w-full px-5 py-3 rounded-xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500 mt-1" placeholder="Street, City, Country"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Contact No</label>
                        <input type="text" id="bizPhone" class="w-full px-5 py-3 rounded-xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500 mt-1">
                    </div>
                    <div>
                        <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Tax ID / GST</label>
                        <input type="text" id="bizTax" class="w-full px-5 py-3 rounded-xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500 mt-1" placeholder="Optional">
                    </div>
                </div>

                <button type="submit" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-xl shadow-indigo-100 hover:bg-indigo-700 transition transform active:scale-95 mt-4">
                    Finish Setup <i class="fa-solid fa-arrow-right ml-2"></i>
                </button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('setupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const bizData = {
                name: document.getElementById('bizName').value,
                industry: document.getElementById('bizIndustry').value,
                currency: document.getElementById('bizCurrency').value,
                address: document.getElementById('bizAddress').value,
                phone: document.getElementById('bizPhone').value,
                tax: document.getElementById('bizTax').value,
                setupDate: new Date().toLocaleDateString()
            };

            localStorage.setItem('AI_POS_BIZ_DATA', JSON.stringify(bizData));
            window.location.href = 'index.html';
        });

        // If already set up, allow bypassing unless they specifically want to edit
        const existing = localStorage.getItem('AI_POS_BIZ_DATA');
        if(existing && !window.location.search.includes('edit=true')) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
