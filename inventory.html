<!DOCTYPE html>
<td class="px-8 py-5 font-black text-indigo-600">${formatMoney(p.price)}</td><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Inventory - AI POS Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body>
    <nav class="bg-slate-900 text-white p-5 flex justify-between items-center shadow-xl sticky top-0 z-50">
        <div class="flex items-center gap-3 font-black italic text-xl">
            <i class="fa-solid fa-boxes-stacked text-indigo-500 text-2xl"></i> AI-POS <span class="text-indigo-500">PRO</span>
        </div>
        <div class="flex gap-8 text-[10px] font-black uppercase tracking-widest">
            <a href="dashboard.html" class="opacity-60 hover:opacity-100 transition">Dashboard</a>
            <a href="billing.html" class="opacity-60 hover:opacity-100 transition">Billing</a>
            <a href="inventory.html" class="text-indigo-400">Inventory</a>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        <div class="lg:col-span-4">
            <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100 sticky top-28">
                <h2 id="formTitle" class="text-xl font-black text-slate-800 mb-6">Product Setup</h2>
                <div class="space-y-4">
                    <input type="hidden" id="editId">
                    <input type="text" id="pName" placeholder="Product Name" class="w-full px-5 py-3 rounded-xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500">
                    
                    <div class="flex gap-2">
                        <input type="number" id="pPrice" placeholder="Price" class="w-1/2 px-5 py-3 rounded-xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500">
                        <select id="pUnit" class="w-1/2 px-5 py-3 rounded-xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500">
                            <option value="PCS">Pieces (PCS)</option><option value="NOS">Numbers (NOS)</option>
                            <option value="KG">Kilograms (KG)</option><option value="GM">Grams (GM)</option>
                            <option value="LTR">Liters (LTR)</option><option value="ML">Milliliters (ML)</option>
                            <option value="MTR">Meters (MTR)</option><option value="FT">Feet (FT)</option>
                            <option value="SQFT">Square Feet</option>
                        </select>
                    </div>

                    <select id="pCat" class="w-full px-5 py-3 rounded-xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500">
                        <option>Groceries</option><option>Hardware</option><option>Dairy</option><option>Textiles</option><option>Other</option>
                    </select>

                    <div class="flex items-center gap-3 p-4 bg-indigo-50 rounded-xl border border-indigo-100">
                        <input type="checkbox" id="askQty" class="w-5 h-5 rounded text-indigo-600">
                        <label for="askQty" class="text-xs font-bold text-indigo-900 leading-tight">Prompt for exact measurement during billing</label>
                    </div>

                    <button onclick="saveProduct()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-lg">Save Product</button>
                    <button onclick="resetForm()" class="w-full text-[10px] font-black uppercase text-slate-400 text-center block">Clear</button>
                </div>
            </div>
        </div>

        <div class="lg:col-span-8">
            <div class="bg-white rounded-[2.5rem] shadow-sm overflow-hidden border border-slate-100">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-widest">
                        <tr>
                            <th class="px-8 py-4">Item</th>
                            <th class="px-8 py-4">Unit</th>
                            <th class="px-8 py-4">Price</th>
                            <th class="px-8 py-4">Prompt?</th>
                            <th class="px-8 py-4"></th>
                        </tr>
                    </thead>
                    <tbody id="inventoryList" class="divide-y divide-slate-50"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 1. Load the business data from the Setup page
const biz = JSON.parse(localStorage.getItem('AI_POS_BIZ_DATA')) || { locale: 'en-US', symbol: '$', currencyCode: 'USD' };

/**
 * 2. The Universal Money Formatter
 * This handles the dots/commas and currency symbol placement automatically.
 */
function formatMoney(amount) {
    try {
        return new Intl.NumberFormat(biz.locale, {
            style: 'currency',
            currency: biz.currencyCode !== 'CUSTOM' ? biz.currencyCode : 'USD',
            maximumFractionDigits: (biz.locale === 'id-ID' || biz.currencyCode === 'IDR') ? 0 : 2
        }).format(amount).replace('USD', biz.symbol); 
    } catch (e) {
        // Fallback if the locale/currency code is invalid
        return biz.symbol + " " + parseFloat(amount).toFixed(2);
    }
}
        let inventory = JSON.parse(localStorage.getItem('AI_POS_INVENTORY')) || [];

        function saveProduct() {
            const id = document.getElementById('editId').value;
            const item = {
                id: id ? parseInt(id) : Date.now(),
                name: document.getElementById('pName').value,
                price: parseFloat(document.getElementById('pPrice').value),
                unit: document.getElementById('pUnit').value,
                cat: document.getElementById('pCat').value,
                askQty: document.getElementById('askQty').checked
            };

            if(id) {
                const idx = inventory.findIndex(p => p.id == id);
                inventory[idx] = item;
            } else {
                inventory.push(item);
            }

            localStorage.setItem('AI_POS_INVENTORY', JSON.stringify(inventory));
            renderTable(); resetForm();
        }

        function renderTable() {
            const list = document.getElementById('inventoryList');
            list.innerHTML = inventory.map(p => `
                <tr class="hover:bg-slate-50">
                    <td class="px-8 py-5 font-bold text-slate-700 capitalize">${p.name}</td>
                    <td class="px-8 py-5"><span class="text-[10px] bg-slate-100 px-2 py-1 rounded font-black">${p.unit}</span></td>
                    <td class="px-8 py-5 font-black text-indigo-600">$${p.price.toFixed(2)}</td>
                    <td class="px-8 py-5 text-xs font-bold ${p.askQty ? 'text-amber-500':'text-slate-300'}">${p.askQty ? 'YES':'NO'}</td>
                    <td class="px-8 py-5 text-right">
                        <button onclick="editProduct(${p.id})" class="text-indigo-400 mx-2"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteProduct(${p.id})" class="text-red-300"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function editProduct(id) {
            const p = inventory.find(i => i.id == id);
            document.getElementById('editId').value = p.id;
            document.getElementById('pName').value = p.name;
            document.getElementById('pPrice').value = p.price;
            document.getElementById('pUnit').value = p.unit;
            document.getElementById('pCat').value = p.cat;
            document.getElementById('askQty').checked = p.askQty;
        }

        function deleteProduct(id) {
            inventory = inventory.filter(p => p.id != id);
            localStorage.setItem('AI_POS_INVENTORY', JSON.stringify(inventory));
            renderTable();
        }

        function resetForm() { document.getElementById('editId').value = ""; document.getElementById('pName').value = ""; document.getElementById('pPrice').value = ""; }
        renderTable();
    </script>
</body>
</html>
