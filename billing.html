<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing - AI POS Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }
        .mic-active { animation: pulse 1s infinite; background: #ef4444 !important; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 100% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); } }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col">

    <nav class="bg-slate-900 text-white p-4 flex justify-between items-center shadow-xl">
        <div class="flex items-center gap-2 font-black italic"><i class="fa-solid fa-microphone-lines text-indigo-500"></i> AI-POS PRO</div>
        <div class="flex gap-6 text-[10px] font-black uppercase tracking-widest">
            <a href="dashboard.html">Dashboard</a><a href="billing.html" class="text-indigo-400">Billing</a><a href="inventory.html">Inventory</a>
        </div>
    </nav>

    <main class="flex-grow flex overflow-hidden">
        <section class="flex-grow p-6 overflow-y-auto" id="posGrid"></section>

        <aside class="w-[400px] bg-white border-l flex flex-col shadow-2xl">
            <div class="p-6 border-b flex justify-between items-center bg-white sticky top-0">
                <h2 class="font-black text-xs uppercase tracking-widest">Live Receipt</h2>
                <button onclick="clearCart()" class="text-red-500 text-[10px] font-black uppercase">Clear</button>
            </div>
            <div class="flex-grow overflow-y-auto p-4 space-y-3" id="cartItems"></div>
            <div class="p-6 bg-slate-50 border-t space-y-4">
                <div class="bg-slate-900 rounded-3xl p-6 text-center text-white relative shadow-xl">
                    <button id="micBtn" class="w-16 h-16 rounded-full bg-indigo-600 flex items-center justify-center mx-auto mb-2"><i class="fa-solid fa-microphone"></i></button>
                    <p id="micText" class="text-[10px] font-black uppercase opacity-60 italic">Hold to use Voice</p>
                </div>
                <div class="flex justify-between items-center">
                    <div><p class="text-[10px] font-black text-slate-400 uppercase">Grand Total</p><h2 class="text-4xl font-black">$<span id="grandTotal">0.00</span></h2></div>
                    <button onclick="window.print()" class="bg-indigo-600 text-white w-14 h-14 rounded-2xl shadow-lg hover:bg-indigo-700 transition"><i class="fa-solid fa-print"></i></button>
                </div>
            </div>
        </aside>
    </main>

    <div id="qtyModal" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center z-[100] backdrop-blur-sm p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-sm p-8 shadow-2xl">
            <h2 id="modalItemName" class="text-xl font-black text-slate-800 capitalize mb-1">Item Name</h2>
            <p id="modalUnit" class="text-[10px] font-black text-indigo-500 uppercase tracking-widest mb-6">MEASUREMENT REQUIRED</p>
            <input type="number" id="manualQty" placeholder="0.00" class="w-full px-5 py-4 rounded-2xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500 mb-6 font-bold text-lg">
            <div class="flex gap-3">
                <button onclick="closeQtyModal()" class="w-1/3 py-4 text-xs font-bold text-slate-400 uppercase">Cancel</button>
                <button onclick="confirmQtyAdd()" class="w-2/3 bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-lg">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        let inventory = JSON.parse(localStorage.getItem('AI_POS_INVENTORY')) || [];
        let cart = [];
        let tempItem = null;

        function renderPOS() {
            const grid = document.getElementById('posGrid');
            grid.innerHTML = `
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                    ${inventory.map(p => `
                        <div onclick="handleClick(${p.id})" class="bg-white p-4 rounded-[2rem] border shadow-sm hover:shadow-xl transition cursor-pointer">
                            <h3 class="font-bold text-slate-800 capitalize">${p.name}</h3>
                            <p class="text-indigo-600 font-black text-xs">$${p.price.toFixed(2)} / ${p.unit}</p>
                            ${p.askQty ? '<span class="text-[8px] font-bold text-amber-500">● REQUIRES MEASUREMENT</span>' : ''}
                        </div>
                    `).join('')}
                </div>`;
        }
// 1. Load the business data from the Setup page
const biz = JSON.parse(localStorage.getItem('AI_POS_BIZ_DATA')) || { locale: 'en-US', symbol: '$', currencyCode: 'USD' };

/**
 * 2. The Universal Money Formatter
 * This handles the dots/commas and currency symbol placement automatically.
 */
function formatMoney(amount) {
    try {
        return new Intl.NumberFormat(biz.locale, {
            style: 'currency',
            currency: biz.currencyCode !== 'CUSTOM' ? biz.currencyCode : 'USD',
            maximumFractionDigits: (biz.locale === 'id-ID' || biz.currencyCode === 'IDR') ? 0 : 2
        }).format(amount).replace('USD', biz.symbol); 
    } catch (e) {
        // Fallback if the locale/currency code is invalid
        return biz.symbol + " " + parseFloat(amount).toFixed(2);
    }
}
        function handleClick(id) {
            const p = inventory.find(item => item.id == id);
            if (p.askQty) {
                tempItem = p;
                document.getElementById('modalItemName').innerText = p.name;
                document.getElementById('modalUnit').innerText = `Enter Quantity in ${p.unit}`;
                document.getElementById('manualQty').value = "";
                document.getElementById('qtyModal').classList.replace('hidden', 'flex');
            } else {
                addToCart(p, 1);
            }
        }

        function confirmQtyAdd() {
            const val = parseFloat(document.getElementById('manualQty').value);
            if (!val || val <= 0) return;
            addToCart(tempItem, val);
            closeQtyModal();
        }

        function closeQtyModal() { document.getElementById('qtyModal').classList.replace('flex', 'hidden'); }

        function addToCart(p, qty) {
            const exists = cart.find(c => c.id === p.id);
            if(exists) exists.qty += qty;
            else cart.push({ ...p, qty });
            updateCart();
        }

        function updateCart() {
            const container = document.getElementById('cartItems');
            let total = 0;
            container.innerHTML = cart.map((item, idx) => {
                const sub = item.qty * item.price;
                total += sub;
                return `
                    <div class="bg-white p-3 rounded-2xl border flex items-center justify-between">
                        <div><p class="font-bold text-xs capitalize">${item.name}</p><p class="text-[9px] font-bold text-slate-400">${item.qty} ${item.unit} x $${item.price}</p></div>
                        <div class="flex items-center gap-3"><p class="font-black text-indigo-600 text-sm">$${sub.toFixed(2)}</p><button onclick="cart.splice(${idx},1); updateCart()" class="text-slate-300">×</button></div>
                    </div>`;
            }).join('');
            document.getElementById('grandTotal').innerText = total.toFixed(2);
        }

        // --- VOICE ENGINE ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(SpeechRecognition) {
            const recognition = new SpeechRecognition();
            const btn = document.getElementById('micBtn');
            recognition.onstart = () => btn.classList.add('mic-active');
            recognition.onend = () => btn.classList.remove('mic-active');
            recognition.onresult = (e) => processVoice(e.results[0][0].transcript.toLowerCase());
            btn.addEventListener('mousedown', () => recognition.start());
            btn.addEventListener('mouseup', () => recognition.stop());
        }

        function processVoice(text) {
            const parts = text.split('and');
            parts.forEach(p => {
                const match = p.match(/(\d+(?:\.\d+)?|half|quarter)?\s*(kg|gm|ltr|ml|mtr|ft|sqft|nos|pcs)?\s*(\w+)/i);
                if(match) {
                    let qty = parseFloat(match[1]) || 1;
                    if(match[1] === 'half') qty = 0.5;
                    const name = match[3];
                    const item = inventory.find(i => name.includes(i.name.toLowerCase()) || i.name.toLowerCase().includes(name));
                    if(item) addToCart(item, qty);
                }
            });
        }

        function clearCart() { cart = []; updateCart(); }
        renderPOS();
    </script>
</body>
</html>
