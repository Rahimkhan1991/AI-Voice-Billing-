<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI POS PRO - Voice Billing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; height: 100dvh; }
        .mic-active { animation: pulse 1.5s infinite; background: #ef4444 !important; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 100% { box-shadow: 0 0 0 25px rgba(239, 68, 68, 0); } }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .cart-bounce { animation: bounce 0.4s cubic-bezier(0.36, 0, 0.66, -0.56) alternate; }
        @keyframes bounce { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
        .measurement-modal { background-color: #003049; color: white; border-radius: 1.5rem; }
        .input-box { background: white; color: #333; border-radius: 0.75rem; text-align: center; font-size: 1.5rem; font-weight: 800; border: none; width: 100%; }
        .unit-label { color: #888; font-size: 1.2rem; position: absolute; right: 15px; top: 50%; transform: translateY(-50%); font-weight: bold; }
    </style>
</head>
<body class="flex flex-col overflow-hidden">

    <nav class="bg-slate-900 text-white p-4 flex justify-between items-center shadow-xl shrink-0">
        <div class="flex items-center gap-3 font-black italic">
            <i class="fa-solid fa-microphone-lines text-indigo-500 text-xl"></i> 
            <span id="navBizName">AI-POS PRO</span>
        </div>
        <div class="flex gap-6 text-[10px] font-black uppercase tracking-widest opacity-60">
            <a href="dashboard.html" class="hover:text-indigo-400">Dashboard</a>
            <a href="inventory.html" class="hover:text-indigo-400">Inventory</a>
        </div>
    </nav>

    <main class="flex-grow flex flex-col overflow-hidden p-4 space-y-4">
        <section class="grid grid-cols-12 gap-4 shrink-0">
            <div class="col-span-8 bg-white border border-slate-200 rounded-[2rem] p-5 shadow-sm flex flex-col justify-center">
                <div class="mb-2">
                    <p class="text-[9px] font-black uppercase text-slate-400 tracking-widest">Listening...</p>
                    <p id="liveText" class="text-xs font-bold text-slate-400 italic truncate">—</p>
                </div>
                <div class="pt-2 border-t border-slate-50">
                    <p class="text-[9px] font-black uppercase text-indigo-400 tracking-widest">Added to Bill</p>
                    <p id="recognizedText" class="text-sm font-black text-slate-800 uppercase truncate">READY</p>
                </div>
            </div>
            <button id="micBtn" class="col-span-4 bg-slate-900 rounded-[2.5rem] flex flex-col items-center justify-center text-white shadow-2xl active:scale-95 transition-all aspect-square border-4 border-white">
                <i class="fa-solid fa-microphone text-2xl mb-1"></i>
                <span class="text-[9px] font-black uppercase tracking-widest">Tap AI</span>
            </button>
        </section>

        <section id="posGrid" class="flex-grow overflow-y-auto grid grid-cols-2 md:grid-cols-4 gap-4 pb-24"></section>
    </main>

    <div class="fixed bottom-6 right-6 flex flex-col items-end space-y-3 z-50">
        <div class="bg-slate-900 text-white px-5 py-2 rounded-full shadow-2xl border border-white/20 text-xs font-black tracking-widest animate-in slide-in-from-right">
            TOTAL: <span id="fabTotal">0.00</span>
        </div>
        <button onclick="toggleCartModal()" id="cartBtn" class="bg-indigo-600 text-white w-20 h-20 rounded-full shadow-2xl flex items-center justify-center relative active:scale-90 transition border-4 border-white">
            <i class="fa-solid fa-receipt text-2xl"></i>
            <span id="cartCount" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-black h-7 w-7 rounded-full flex items-center justify-center border-2 border-white hidden">0</span>
        </button>
    </div>

    <div id="cartModal" class="fixed inset-0 z-[200] hidden flex-col bg-slate-950 p-8 animate-in slide-in-from-bottom duration-300">
        <div class="flex justify-between items-center mb-8 border-b border-white/10 pb-4">
            <div>
                <h2 class="text-2xl font-black text-white italic">Current <span class="text-indigo-400">Bill</span></h2>
                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mt-1">Review items before payment</p>
            </div>
            <button onclick="toggleCartModal()" class="w-12 h-12 rounded-full bg-white/10 text-white text-2xl flex items-center justify-center hover:bg-red-500 transition-colors">&times;</button>
        </div>
        <div id="cartItems" class="flex-grow overflow-y-auto space-y-3 pr-2 hide-scroll"></div>
        <div class="mt-8 pt-8 border-t border-white/10 bg-slate-950 space-y-6">
            <div class="flex justify-between items-center">
                <p class="text-xs font-black uppercase text-slate-500 tracking-widest">Grand Total</p>
                <h2 id="cartTotal" class="text-5xl font-black text-white leading-none">0.00</h2>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <button onclick="finalizeSale('CASH')" class="bg-emerald-500 text-white py-6 rounded-[2rem] font-black text-lg shadow-lg hover:bg-emerald-600 active:scale-95 transition">CASH</button>
                <button onclick="finalizeSale('QRIS')" class="bg-indigo-600 text-white py-6 rounded-[2rem] font-black text-lg shadow-lg hover:bg-indigo-700 active:scale-95 transition">QRIS</button>
            </div>
            <button onclick="clearCart()" class="w-full py-2 text-[10px] font-black text-red-400 uppercase tracking-[0.3em] opacity-50 hover:opacity-100 transition">Clear Transaction</button>
        </div>
    </div>

    <div id="qtyModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-[300] p-4">
        <div class="measurement-modal w-full max-w-xs p-6 relative">
            <div class="text-center mb-4">
                <h3 id="modalItemName" class="text-lg font-black uppercase text-white">Item Name</h3>
                <p class="text-indigo-300 text-[10px] font-bold mt-1 uppercase tracking-widest">Stock: <span id="modalStock">0</span> <span id="stockUnit"></span></p>
            </div>
            <div class="space-y-3">
                <div class="relative">
                    <input type="number" id="primaryQty" oninput="convertUnits('primary')" class="input-box p-3" placeholder="0">
                    <span id="primaryLabel" class="unit-label text-sm uppercase">kg</span>
                </div>
                <div id="secondaryContainer" class="relative">
                    <input type="number" id="secondaryQty" oninput="convertUnits('secondary')" class="input-box p-3 text-lg" placeholder="0">
                    <span id="secondaryLabel" class="unit-label text-sm uppercase">gm</span>
                </div>
                <button onclick="confirmQtyAdd()" class="w-full bg-indigo-500 py-4 rounded-xl text-white font-black text-sm shadow-xl active:scale-95 transition">CONFIRM</button>
            </div>
        </div>
    </div>

    <script>
        const biz = JSON.parse(localStorage.getItem('AI_POS_BIZ_DATA')) || { locale: 'id-ID', symbol: 'Rp', currencyCode: 'IDR' };
        let inventory = JSON.parse(localStorage.getItem('AI_POS_INVENTORY')) || [];
        let sales = JSON.parse(localStorage.getItem('AI_POS_SALES')) || [];
        let cart = [];
        let tempItem = null;

        function formatMoney(amount) {
            return new Intl.NumberFormat(biz.locale, { style: 'currency', currency: biz.currencyCode !== 'CUSTOM' ? biz.currencyCode : 'USD', maximumFractionDigits: 0 }).format(amount).replace('USD', biz.symbol);
        }

        function speak(msg) {
            const u = new SpeechSynthesisUtterance(msg); u.lang = biz.locale; window.speechSynthesis.speak(u);
        }

        function renderPOS() {
            const grid = document.getElementById('posGrid');
            grid.innerHTML = inventory.map(p => `
                <div onclick="addToCart(${p.id})" class="bg-white p-5 rounded-[2rem] shadow-sm border border-slate-100 flex flex-col justify-between aspect-square active:scale-95 transition-all group cursor-pointer">
                    <div>
                        <p class="text-[8px] font-black text-indigo-400 uppercase tracking-tighter">${p.category} | ${p.unit}</p>
                        <h3 class="font-bold text-slate-800 text-sm leading-tight mt-1 group-hover:text-indigo-600 transition-colors">${p.name}</h3>
                    </div>
                    <p class="text-indigo-600 font-black text-xs">${formatMoney(p.price)}</p>
                </div>
            `).join('');
        }

        function addToCart(id, qty = 1) {
            const product = inventory.find(p => p.id == id);
            if (!product) return;

            // Trigger modal for weighted items if quantity is the default tap (1)
            if (product.askQty && !tempItem) {
                tempItem = product;
                setupModalUnits(product.unit);
                document.getElementById('modalItemName').innerText = product.name;
                document.getElementById('modalStock').innerText = product.stock || 0;
                document.getElementById('stockUnit').innerText = product.unit;
                document.getElementById('primaryQty').value = 1;
                convertUnits('primary');
                document.getElementById('qtyModal').classList.replace('hidden', 'flex');
                return;
            }

            const exists = cart.find(c => c.id === id);
            if (exists) { exists.qty += qty; } else { cart.push({ ...product, qty }); }

            tempItem = null; 
            const btn = document.getElementById('cartBtn');
            if(btn) { btn.classList.add('cart-bounce'); setTimeout(() => btn.classList.remove('cart-bounce'), 400); }
            updateCartUI();
        }

        function setupModalUnits(unit) {
            const pLabel = document.getElementById('primaryLabel'), sLabel = document.getElementById('secondaryLabel'), sCont = document.getElementById('secondaryContainer');
            sCont.style.display = "block";
            if (unit === "KG") { pLabel.innerText = "kg"; sLabel.innerText = "gm"; }
            else if (unit === "LTR") { pLabel.innerText = "ltr"; sLabel.innerText = "ml"; }
            else if (unit === "MTR") { pLabel.innerText = "mtr"; sLabel.innerText = "cm"; }
            else { sCont.style.display = "none"; pLabel.innerText = unit; }
        }

        function convertUnits(type) {
            const p = document.getElementById('primaryQty'), s = document.getElementById('secondaryQty');
            if (type === 'primary') s.value = p.value ? p.value * 1000 : "";
            else p.value = s.value ? s.value / 1000 : "";
        }

        function confirmQtyAdd() {
            const q = parseFloat(document.getElementById('primaryQty').value);
            if (q > 0 && tempItem) {
                const item = tempItem;
                tempItem = "LOCK"; // Prevent re-triggering modal
                addToCart(item.id, q);
                closeQtyModal();
            }
        }

        function closeQtyModal() { tempItem = null; document.getElementById('qtyModal').classList.replace('flex', 'hidden'); }

        function updateCartUI() {
            // Badge shows unique item rows, not total sum of quantities
            const uniqueCount = cart.length; 
            const badge = document.getElementById('cartCount');
            if(badge) { badge.innerText = uniqueCount; badge.classList.toggle('hidden', uniqueCount === 0); }

            const total = cart.reduce((acc, i) => acc + (i.qty * i.price), 0);
            document.getElementById('cartTotal').innerText = formatMoney(total);
            document.getElementById('fabTotal').innerText = formatMoney(total);

            document.getElementById('cartItems').innerHTML = cart.map((item, idx) => `
                <div class="bg-white/5 p-5 rounded-[2rem] flex justify-between items-center text-white border border-white/5">
                    <div>
                        <p class="font-bold text-sm capitalize">${item.name}</p>
                        <p class="text-[10px] font-black text-indigo-400 uppercase tracking-widest">${item.qty} ${item.unit} x ${formatMoney(item.price)}</p>
                    </div>
                    <button onclick="removeFromCart(${idx})" class="w-10 h-10 rounded-full bg-red-500/20 text-red-500 flex items-center justify-center">&times;</button>
                </div>
            `).join('');
        }

        function removeFromCart(idx) { cart.splice(idx, 1); updateCartUI(); }

        function toggleCartModal() {
            const modal = document.getElementById('cartModal');
            const isHidden = modal.classList.toggle('hidden');
            document.body.style.overflow = isHidden ? 'auto' : 'hidden';
        }

        function clearCart() { if(confirm("Discard bill?")) { cart = []; updateCartUI(); toggleCartModal(); } }

        // --- SPEECH ENGINE ---
        const Recognition = window.webkitSpeechRecognition || window.Recognition;
        if(Recognition) {
            const rec = new Recognition(); rec.lang = biz.locale; rec.interimResults = true;
            const btn = document.getElementById('micBtn');
            btn.onclick = () => { try { rec.start(); } catch(e) {} };
            rec.onstart = () => { btn.classList.add("mic-active"); };
            rec.onend = () => { btn.classList.remove("mic-active"); };
            rec.onresult = (e) => {
                let interim = "";
                for (let i = e.resultIndex; i < e.results.length; i++) {
                    if (e.results[i].isFinal) {
                        const text = e.results[i][0].transcript.toLowerCase();
                        document.getElementById('recognizedText').innerText = text;
                        processVoice(text);
                    } else {
                        interim += e.results[i][0].transcript;
                        document.getElementById('liveText').innerText = interim;
                    }
                }
            };
        }

        function processVoice(text) {
            let qty = 1;
            let match = text.match(/(\d+)/);
            if(match) qty = parseInt(match[1]);
            const product = inventory.find(p => text.includes(p.name.toLowerCase()) || p.name.toLowerCase().includes(text.replace(/\d+/g, "").trim()));
            if(product) { 
                // Voice bypassing modal and using direct quantity
                const exists = cart.find(c => c.id === product.id);
                if (exists) { exists.qty += qty; } else { cart.push({ ...product, qty }); }
                updateCartUI();
                speak(`Added ${qty} ${product.name}`); 
            }
        }

        function finalizeSale(method) {
            const total = cart.reduce((acc, i) => acc + (i.qty * i.price), 0);
            const profit = cart.reduce((acc, i) => acc + (i.qty * (i.price - (i.purchasePrice || 0))), 0);
            const tx = { invoiceNo: "INV-"+Date.now().toString().slice(-6), date: new Date().toLocaleString(), items: [...cart], total, profit, payment: method };
            sales.push(tx);
            localStorage.setItem('AI_POS_SALES', JSON.stringify(sales));
            
            cart.forEach(c => {
                const inv = inventory.find(p => p.id === c.id);
                if(inv) inv.stock = (parseFloat(inv.stock) || 0) - c.qty;
            });
            localStorage.setItem('AI_POS_INVENTORY', JSON.stringify(inventory));
            
            toggleCartModal(); cart = []; updateCartUI(); speak("Paid");
            const win = window.open('', '', 'width=300,height=600');
            win.document.write(`<html><body onload="window.print();window.close()"><div style="width:58mm;font-family:monospace;font-size:10px;"><center><h3>${biz.name}</h3></center><hr>${tx.items.map(i => `<div>${i.name} x${i.qty} = ${(i.qty*i.price).toLocaleString()}</div>`).join('')}<hr>TOTAL: ${formatMoney(tx.total)}<br>Method: ${tx.payment}</div></body></html>`);
            win.document.close();
        }

        document.getElementById('navBizName').innerText = biz.name;
        renderPOS();
    </script>
</body>
</html>
