<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing - AI POS Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }
        .mic-active { animation: pulse 1s infinite; background: #ef4444 !important; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 100% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); } }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .active-tab { background-color: #4f46e5; color: white; box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4); }
        @media print { .no-print { display: none; } .print-only { display: block; } }
        .print-only { display: none; }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col">

    <nav class="bg-slate-900 text-white p-4 flex justify-between items-center shadow-xl shrink-0 no-print">
        <div class="flex items-center gap-3 font-black italic">
            <i class="fa-solid fa-microphone-lines text-indigo-500 text-xl"></i> 
            <span id="navBizName">AI-POS PRO</span>
        </div>
        <div class="flex gap-6 text-[10px] font-black uppercase tracking-widest">
            <a href="index.html" class="opacity-50 hover:opacity-100 transition">Dashboard</a>
            <a href="billing.html" class="text-indigo-400">Billing</a>
            <a href="inventory.html" class="opacity-50 hover:opacity-100 transition">Inventory</a>
        </div>
    </nav>

    <main class="flex-grow flex overflow-hidden">
        
        <section class="flex-grow flex flex-col p-6 overflow-hidden no-print">
            <div class="flex gap-2 mb-6 overflow-x-auto hide-scroll shrink-0" id="industryTabs"></div>

            <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4 overflow-y-auto pr-2" id="posGrid"></div>
        </section>

        <aside class="w-[420px] bg-white border-l border-slate-200 flex flex-col shadow-2xl overflow-hidden">
            
            <div id="printHeader" class="print-only p-8 text-center border-b mb-4">
                <h1 id="pHeaderName" class="text-2xl font-black uppercase"></h1>
                <p id="pHeaderAddr" class="text-xs text-slate-500"></p>
                <p id="pHeaderPhone" class="text-xs font-bold"></p>
                <div class="mt-4 flex justify-between text-[10px] font-bold">
                    <span>DATE: <span id="pDate"></span></span>
                    <span>TAX ID: <span id="pTax"></span></span>
                </div>
            </div>

            <div class="p-6 border-b flex justify-between items-center shrink-0 no-print">
                <h2 class="font-black text-slate-800 text-xs uppercase tracking-widest">Live Invoice</h2>
                <button onclick="clearCart()" class="text-red-500 text-[10px] font-black uppercase">Reset Bill</button>
            </div>

            <div class="px-4 mt-4 no-print">
                <button onclick="openManualSale()" class="w-full py-3 border-2 border-dashed border-slate-200 rounded-2xl text-[10px] font-black text-slate-400 hover:border-indigo-400 hover:text-indigo-600 transition uppercase">
                    + Manual Unlisted Item
                </button>
            </div>

            <div class="flex-grow overflow-y-auto p-4 space-y-3" id="cartItems">
                <p class="text-center text-slate-300 mt-20 text-sm italic">Add items to start billing...</p>
            </div>

            <div class="p-8 bg-slate-50 border-t border-slate-100 space-y-6 no-print">
                <div class="bg-slate-900 rounded-[2.5rem] p-6 text-center text-white relative shadow-xl overflow-hidden group">
                    <button id="micBtn" class="w-16 h-16 rounded-full bg-indigo-600 flex items-center justify-center mx-auto mb-2 shadow-lg active:scale-95 transition-all">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                    <p id="micText" class="text-[10px] font-black uppercase tracking-widest opacity-60 italic">Hold for Voice AI</p>
                </div>

                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-[10px] font-black text-slate-400 uppercase mb-1">Total Payable</p>
                        <h2 class="text-4xl font-black text-slate-900 leading-none"><span id="grandTotal">0.00</span></h2>
                    </div>
                    <button onclick="checkout()" class="bg-indigo-600 text-white w-16 h-16 rounded-3xl shadow-xl flex items-center justify-center hover:bg-indigo-700 active:scale-90 transition">
                        <i class="fa-solid fa-check text-xl"></i>
                    </button>
                </div>
            </div>
        </aside>
    </main>

    <div id="qtyModal" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center z-[100] backdrop-blur-md p-4 no-print">
        <div class="bg-white rounded-[2.5rem] w-full max-w-sm p-8 shadow-2xl">
            <h2 id="modalItemName" class="text-xl font-black text-slate-800 capitalize mb-1">Product</h2>
            <p id="modalUnit" class="text-[10px] font-black text-indigo-500 uppercase tracking-widest mb-6">Enter Exact Quantity</p>
            <input type="number" id="manualQty" step="any" placeholder="0.00" class="w-full px-5 py-5 rounded-2xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500 mb-6 font-bold text-2xl">
            <div class="flex gap-3">
                <button onclick="closeQtyModal()" class="w-1/3 py-4 text-xs font-bold text-slate-400 uppercase">Cancel</button>
                <button onclick="confirmQtyAdd()" class="w-2/3 bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-lg">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. CONFIG & DATA ---
        const biz = JSON.parse(localStorage.getItem('AI_POS_BIZ_DATA')) || { name: "AI POS", currencyCode: "USD", symbol: "$", locale: "en-US" };
        let inventory = JSON.parse(localStorage.getItem('AI_POS_INVENTORY')) || [];
        let cart = [];
        let tempItem = null;
        let activeIndustry = "All";

        // --- 2. GLOBAL FORMATTER ---
        function formatMoney(amount) {
            return new Intl.NumberFormat(biz.locale, {
                style: 'currency',
                currency: biz.currencyCode !== 'CUSTOM' ? biz.currencyCode : 'USD',
                maximumFractionDigits: (biz.locale === 'id-ID' || biz.currencyCode === 'IDR') ? 0 : 2
            }).format(amount).replace('USD', biz.symbol);
        }

        // --- 3. UI RENDERING ---
        function renderTabs() {
            const industries = ["All", ...new Set(inventory.map(p => p.industry))];
            const container = document.getElementById('industryTabs');
            container.innerHTML = industries.map(ind => `
                <button onclick="activeIndustry='${ind}'; renderTabs(); renderPOS();" class="px-6 py-2.5 rounded-2xl text-[10px] font-black uppercase tracking-widest transition whitespace-nowrap ${activeIndustry == ind ? 'active-tab' : 'bg-white text-slate-400 hover:bg-slate-50'}">
                    ${ind}
                </button>
            `).join('');
        }

        function renderPOS() {
            const grid = document.getElementById('posGrid');
            const filtered = activeIndustry === "All" ? inventory : inventory.filter(p => p.industry === activeIndustry);
            
            grid.innerHTML = filtered.map(p => `
                <div onclick="handleClick(${p.id})" class="bg-white p-5 rounded-[2.5rem] border border-slate-100 shadow-sm hover:shadow-2xl hover:-translate-y-1 transition-all cursor-pointer group">
                    <div class="flex justify-between items-start mb-4">
                        <span class="text-[8px] font-black text-slate-300 uppercase bg-slate-50 px-2 py-1 rounded-md">${p.unit}</span>
                        ${p.askQty ? '<div class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></div>' : ''}
                    </div>
                    <h3 class="font-bold text-slate-800 capitalize group-hover:text-indigo-600 transition mb-1">${p.name}</h3>
                    <p class="text-indigo-600 font-black text-sm">${formatMoney(p.price)}</p>
                </div>
            `).join('');
        }

        // --- 4. BILLING LOGIC ---
        function handleClick(id) {
            const p = inventory.find(item => item.id == id);
            if (p.askQty) {
                tempItem = p;
                document.getElementById('modalItemName').innerText = p.name;
                document.getElementById('modalUnit').innerText = `Enter Quantity (${p.unit})`;
                document.getElementById('manualQty').value = "";
                document.getElementById('qtyModal').classList.replace('hidden', 'flex');
            } else {
                addToCart(p, 1);
            }
        }

        function confirmQtyAdd() {
            const val = parseFloat(document.getElementById('manualQty').value);
            if (!val || val <= 0) return;
            addToCart(tempItem, val);
            closeQtyModal();
        }

        function openManualSale() {
            const name = prompt("Enter Unlisted Item Name:");
            const price = parseFloat(prompt("Enter Price:"));
            if (name && !isNaN(price)) {
                const item = { id: Date.now(), name, price, unit: 'pcs', askQty: false };
                addToCart(item, 1);
            }
        }

        function addToCart(product, qty) {
            const existing = cart.find(c => c.id === product.id);
            if(existing) existing.qty += qty;
            else cart.push({ ...product, qty });
            updateCart();
            speak(`Added ${qty} ${product.name}`);
        }

        function updateCart() {
            const cont = document.getElementById('cartItems');
            let total = 0;
            cont.innerHTML = cart.map((item, idx) => {
                const sub = item.qty * item.price;
                total += sub;
                return `
                    <div class="bg-slate-50 p-4 rounded-3xl border border-slate-100 flex items-center justify-between group">
                        <div class="flex-grow">
                            <p class="font-bold text-slate-800 text-xs capitalize">${item.name}</p>
                            <p class="text-[9px] font-bold text-slate-400 uppercase">${item.qty} ${item.unit} x ${formatMoney(item.price)}</p>
                        </div>
                        <div class="text-right">
                            <p class="font-black text-indigo-600 text-sm">${formatMoney(sub)}</p>
                            <button onclick="cart.splice(${idx},1); updateCart()" class="text-[8px] font-black text-red-300 hover:text-red-500 uppercase">Remove</button>
                        </div>
                    </div>`;
            }).join('');
            document.getElementById('grandTotal').innerText = formatMoney(total);
        }

        // --- 5. VOICE AI ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(SpeechRecognition) {
            const recognition = new SpeechRecognition();
            const btn = document.getElementById('micBtn');
            recognition.onstart = () => btn.classList.add('mic-active');
            recognition.onend = () => btn.classList.remove('mic-active');
            recognition.onresult = (e) => processVoice(e.results[0][0].transcript.toLowerCase());
            btn.addEventListener('mousedown', () => recognition.start());
            btn.addEventListener('mouseup', () => recognition.stop());
        }

        function processVoice(text) {
            const parts = text.split('and');
            parts.forEach(p => {
                const match = p.match(/(\d+(?:\.\d+)?|half|quarter)?\s*(\w+)?\s*(\w+)/i);
                if(match) {
                    let qty = parseFloat(match[1]) || 1;
                    if(match[1] === 'half') qty = 0.5;
                    const namePart = match[3];
                    const item = inventory.find(i => namePart.includes(i.name.toLowerCase()) || i.name.toLowerCase().includes(namePart));
                    if(item) addToCart(item, qty);
                }
            });
        }

        function speak(m) {
            const u = new SpeechSynthesisUtterance(m);
            u.rate = 1.1; window.speechSynthesis.speak(u);
        }

        // --- 6. CHECKOUT & PRINT ---
        function checkout() {
            if(cart.length === 0) return alert("Cart is empty!");
            // Populate Print Receipt
            document.getElementById('navBizName').innerText = biz.name;
            document.getElementById('pHeaderName').innerText = biz.name;
            document.getElementById('pHeaderAddr').innerText = biz.address;
            document.getElementById('pHeaderPhone').innerText = "TEL: " + (biz.phone || "-");
            document.getElementById('pTax').innerText = biz.tax || "N/A";
            document.getElementById('pDate').innerText = new Date().toLocaleString();
            
            window.print();
        }

        function closeQtyModal() { document.getElementById('qtyModal').classList.replace('flex', 'hidden'); }
        function clearCart() { cart = []; updateCart(); }

        // Initial Boot
        document.getElementById('navBizName').innerText = biz.name;
        renderTabs();
        renderPOS();
    </script>
</body>
</html>
