<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI POS PRO - Universal Billing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }
        .mic-active { animation: pulse 1s infinite; background: #ef4444 !important; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 100% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); } }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        
        /* Measurement Modal Styling */
        .measurement-modal { background-color: #003049; color: white; border-radius: 8px; border: 1px solid #ffffff20; }
        .input-box { background: white; color: #333; border-radius: 4px; text-align: center; font-size: 2rem; font-weight: 800; border: none; }
        .unit-label { color: #888; font-size: 1.2rem; position: absolute; right: 15px; top: 50%; transform: translateY(-50%); font-weight: bold; }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col">

    <nav class="bg-slate-900 text-white p-4 flex justify-between items-center shadow-xl shrink-0 no-print">
        <div class="flex items-center gap-3 font-black italic">
            <i class="fa-solid fa-microphone-lines text-indigo-500 text-xl"></i> 
            <span id="navBizName">AI-POS PRO</span>
        </div>
        <div class="flex gap-6 text-[10px] font-black uppercase tracking-widest">
            <a href="dashboard.html" class="opacity-50 hover:opacity-100 transition">Dashboard</a>
            <a href="billing.html" class="text-indigo-400">Billing</a>
            <a href="inventory.html" class="opacity-50 hover:opacity-100 transition">Inventory</a>
        </div>
    </nav>

    <main class="flex-grow flex overflow-hidden">
        
        <section class="flex-grow p-6 flex flex-col overflow-hidden no-print">
            <div class="flex gap-3 mb-6 overflow-x-auto hide-scroll pb-2" id="categoryTabs"></div>
            <div class="flex-grow overflow-y-auto" id="posGrid"></div>
        </section>

        <aside class="w-[420px] bg-white border-l border-slate-200 flex flex-col shadow-2xl no-print">
            <div class="p-6 border-b flex justify-between items-center shrink-0">
                <h2 class="font-black text-xs uppercase tracking-widest text-slate-400">Live Receipt</h2>
                <button onclick="clearCart()" class="text-red-500 text-[10px] font-black uppercase">Reset Bill</button>
            </div>

            <div class="flex-grow overflow-y-auto p-4 space-y-3" id="cartItems">
                <p class="text-center text-slate-300 mt-20 text-sm italic">Cart is empty</p>
            </div>

            <div class="p-8 bg-slate-50 border-t space-y-6">
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-[10px] font-black text-slate-400 uppercase mb-1 tracking-widest">Grand Total</p>
                        <h2 class="text-4xl font-black text-slate-900 leading-none" id="grandTotalDisplay">0.00</h2>
                    </div>
                    <button onclick="checkoutTrigger()" class="bg-indigo-600 text-white w-20 h-20 rounded-[2rem] shadow-xl flex items-center justify-center hover:bg-indigo-700 active:scale-90 transition transform">
                        <i class="fa-solid fa-print text-2xl"></i>
                    </button>
                </div>
                
                <div class="bg-slate-900 rounded-3xl p-4 text-center text-white relative shadow-lg">
                    <button id="micBtn" class="w-12 h-12 rounded-full bg-indigo-600 flex items-center justify-center mx-auto mb-1">
                        <i class="fa-solid fa-microphone text-sm"></i>
                    </button>
                    <p id="micText" class="text-[9px] font-black uppercase opacity-60 italic">Voice AI Active</p>
                </div>
            </div>
        </aside>
    </main>

    <div id="qtyModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-[100] backdrop-blur-sm p-4">
        <div class="measurement-modal w-full max-w-lg p-8 relative shadow-2xl">
            <button onclick="closeQtyModal()" class="absolute top-4 right-6 text-2xl text-slate-400 hover:text-white">×</button>
            <div class="text-center mb-6">
                <p class="text-indigo-300 text-[10px] font-black uppercase tracking-[0.2em] mb-1">Stock Availability</p>
                <h3 class="text-2xl font-black text-white"><span id="modalStock">0</span> <span id="stockUnit">Units</span></h3>
            </div>
            <div class="space-y-4">
                <h2 id="modalItemName" class="text-center text-xl font-bold uppercase tracking-tight text-white mb-4 italic">Product Name</h2>
                <div class="relative">
                    <input type="number" id="primaryQty" step="any" oninput="convertUnits('primary')" class="input-box w-full py-4 pr-20">
                    <span id="primaryLabel" class="unit-label uppercase font-black">kg</span>
                </div>
                <div id="secondaryContainer" class="relative">
                    <input type="number" id="secondaryQty" step="any" oninput="convertUnits('secondary')" class="input-box w-full py-4 pr-20">
                    <span id="secondaryLabel" class="unit-label uppercase font-black">gm</span>
                </div>
                <button onclick="confirmQtyAdd()" class="w-full bg-blue-600 hover:bg-blue-700 py-5 rounded-lg text-white font-black text-xl shadow-xl transition-all flex items-center justify-center mt-6">
                    ADD TO BILL
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- DATA & CONFIG ---
        const biz = JSON.parse(localStorage.getItem('AI_POS_BIZ_DATA')) || { locale: 'id-ID', symbol: 'Rp', currencyCode: 'IDR' };
        let inventory = JSON.parse(localStorage.getItem('AI_POS_INVENTORY')) || [];
        let sales = JSON.parse(localStorage.getItem('AI_POS_SALES')) || [];
        let cart = [];
        let tempItem = null;
        let activeCategory = "All";

        // --- HELPERS ---
        function formatMoney(amount) {
            return new Intl.NumberFormat(biz.locale, {
                style: 'currency', currency: biz.currencyCode !== 'CUSTOM' ? biz.currencyCode : 'USD',
                maximumFractionDigits: (biz.locale === 'id-ID' || biz.currencyCode === 'IDR') ? 0 : 2
            }).format(amount).replace('USD', biz.symbol);
        }

        function speak(m) {
            const u = new SpeechSynthesisUtterance(m);
            u.lang = biz.locale;
            window.speechSynthesis.speak(u);
        }

        // --- UI RENDER ---
        function renderCategoryTabs() {
            const container = document.getElementById('categoryTabs');
            const categories = ["All", ...new Set(inventory.map(p => p.category))];
            container.innerHTML = categories.map(cat => `
                <button onclick="filterByCategory('${cat}')" 
                    class="px-6 py-2.5 rounded-2xl text-[10px] font-black uppercase tracking-widest transition whitespace-nowrap 
                    ${activeCategory === cat ? 'bg-indigo-600 text-white' : 'bg-white text-slate-400'}">
                    ${cat}
                </button>
            `).join('');
        }

        function filterByCategory(cat) { activeCategory = cat; renderCategoryTabs(); renderPOS(); }

        function renderPOS() {
            const grid = document.getElementById('posGrid');
            const filtered = activeCategory === "All" ? inventory : inventory.filter(p => p.category === activeCategory);
            grid.innerHTML = `<div class="grid grid-cols-2 lg:grid-cols-4 gap-6">
                ${filtered.map(p => `
                    <div onclick="handleClick(${p.id})" class="bg-white p-6 rounded-[2.5rem] border shadow-sm hover:shadow-2xl transition cursor-pointer group">
                        <p class="text-[9px] font-black text-indigo-400 uppercase mb-2">${p.category} | ${p.unit}</p>
                        <h3 class="font-bold text-slate-800 capitalize text-lg group-hover:text-indigo-600">${p.name}</h3>
                        <p class="text-indigo-600 font-black text-sm mt-1">${formatMoney(p.price)}</p>
                    </div>
                `).join('')}
            </div>`;
        }

        // --- LOGIC ---
        function handleClick(id) {
            const p = inventory.find(item => item.id == id);
            if (p.askQty) {
                tempItem = p;
                setupModalUnits(p.unit);
                document.getElementById('modalItemName').innerText = p.name;
                document.getElementById('modalStock').innerText = p.stock || 0;
                document.getElementById('stockUnit').innerText = p.unit;
                document.getElementById('primaryQty').value = 1;
                convertUnits('primary');
                document.getElementById('qtyModal').classList.replace('hidden', 'flex');
                document.getElementById('primaryQty').focus();
            } else { addToCart(p, 1); }
        }

        function setupModalUnits(unit) {
            const pLabel = document.getElementById('primaryLabel'), sLabel = document.getElementById('secondaryLabel'), sCont = document.getElementById('secondaryContainer');
            sCont.style.display = "block";
            if (unit === "KG") { pLabel.innerText = "kg"; sLabel.innerText = "gm"; }
            else if (unit === "LTR") { pLabel.innerText = "ltr"; sLabel.innerText = "ml"; }
            else if (unit === "MTR") { pLabel.innerText = "mtr"; sLabel.innerText = "cm"; }
            else { sCont.style.display = "none"; pLabel.innerText = unit; }
        }

        function convertUnits(type) {
            const p = document.getElementById('primaryQty'), s = document.getElementById('secondaryQty');
            if (type === 'primary') s.value = p.value * 1000;
            else p.value = s.value / 1000;
        }

        function confirmQtyAdd() {
            const q = parseFloat(document.getElementById('primaryQty').value);
            if (q > 0) { addToCart(tempItem, q); closeQtyModal(); }
        }

        function closeQtyModal() { document.getElementById('qtyModal').classList.replace('flex', 'hidden'); }

        function addToCart(p, qty) {
            const exists = cart.find(c => c.id === p.id);
            if(exists) exists.qty += qty; else cart.push({ ...p, qty });
            updateCart();
        }

        function updateCart() {
            const cont = document.getElementById('cartItems');
            let total = 0;
            cont.innerHTML = cart.map((item, idx) => {
                const sub = item.qty * item.price; total += sub;
                return `<div class="bg-white p-4 rounded-3xl border flex items-center justify-between shadow-sm">
                    <div><p class="font-bold text-slate-800 text-sm capitalize">${item.name}</p>
                    <p class="text-[9px] font-bold text-slate-400 uppercase">${item.qty} ${item.unit} x ${formatMoney(item.price)}</p></div>
                    <div class="text-right"><p class="font-black text-indigo-600 text-sm">${formatMoney(sub)}</p>
                    <button onclick="cart.splice(${idx},1); updateCart()" class="text-[10px] font-bold text-red-300">REMOVE</button></div>
                </div>`;
            }).join('');
            document.getElementById('grandTotalDisplay').innerText = formatMoney(total);
        }

        // --- CHECKOUT & PAYMENT ---
        function checkoutTrigger() {
            if (cart.length === 0) return alert("Cart empty!");
            const totalStr = document.getElementById('grandTotalDisplay').innerText;
            speak(`Total bill amount is ${totalStr}. Please select payment method.`);
            showPaymentModal(totalStr);
        }

        function showPaymentModal(totalStr) {
            const modal = document.createElement('div');
            modal.id = "payModal";
            modal.className = "fixed inset-0 bg-slate-900/90 flex items-center justify-center z-[200] p-6 backdrop-blur-md";
            modal.innerHTML = `
                <div class="bg-white rounded-[2.5rem] p-10 w-full max-w-sm text-center shadow-2xl">
                    <h2 class="text-2xl font-black text-slate-800 mb-2">Payment</h2>
                    <p class="text-indigo-600 font-black text-xl mb-8">${totalStr}</p>
                    <div class="grid grid-cols-1 gap-4">
                        <button onclick="finalizeSale('CASH')" class="bg-emerald-500 text-white py-5 rounded-2xl font-black text-lg">CASH</button>
                        <button onclick="finalizeSale('QRIS')" class="bg-indigo-600 text-white py-5 rounded-2xl font-black text-lg">QRIS / BANK</button>
                    </div>
                </div>`;
            document.body.appendChild(modal);
        }

        function finalizeSale(method) {
            const total = cart.reduce((acc, i) => acc + (i.qty * i.price), 0);
            const profit = cart.reduce((acc, i) => acc + (i.qty * (i.price - (i.purchasePrice || 0))), 0);
            const invNo = `INV-${new Date().getFullYear()}-${(sales.length + 1).toString().padStart(4, '0')}`;
            const tx = { invoiceNo: invNo, date: new Date().toLocaleString(), items: [...cart], total, profit, payment: method };
            
            sales.push(tx);
            localStorage.setItem('AI_POS_SALES', JSON.stringify(sales));
            document.getElementById('payModal').remove();
            printThermal(tx);
            cart = []; updateCart();
            speak("Sale completed.");
        }

        function printThermal(tx) {
            const win = window.open('', '', 'width=300,height=600');
            let rows = tx.items.map(i => `<div style="display:flex;justify-content:space-between;font-size:11px;"><span>${i.name.toUpperCase()} x${i.qty}</span><span>${(i.qty*i.price).toLocaleString()}</span></div>`).join('');
            win.document.write(`<html><style>@page{size:58mm auto;margin:0;}body{width:58mm;padding:4mm;font-family:monospace;font-size:11px;}.center{text-align:center;}.line{border-top:1px dashed #000;margin:5px 0;}</style>
            <body onload="window.print();window.close()"><div class="center"><h2 style="margin:0;">${biz.name}</h2><p style="margin:0;font-size:9px;">${biz.address}</p></div><div class="line"></div>
            <p>INV: ${tx.invoiceNo}<br>Date: ${tx.date}</p><div class="line"></div>${rows}<div class="line"></div>
            <div style="display:flex;justify-content:space-between;font-weight:bold;"><span>TOTAL</span><span>${biz.symbol}${tx.total.toLocaleString()}</span></div>
            <p>Payment: ${tx.payment}</p><div class="line"></div><p class="center">THANK YOU!</p></body></html>`);
            win.document.close();
        }

        // --- VOICE ---
        const Recognition = window.webkitSpeechRecognition;
        if(Recognition) {
            const rec = new Recognition();
            const btn = document.getElementById('micBtn');
            rec.onresult = (e) => {
                const text = e.results[0][0].transcript.toLowerCase();
                const match = text.match(/(\d+(?:\.\d+)?|half)?\s*(\w+)?\s*(\w+)/i);
                if(match) {
                    let q = parseFloat(match[1]) || 1;
                    if(match[1] === 'half') q = 0.5;
                    const item = inventory.find(i => match[3].includes(i.name.toLowerCase()));
                    if(item) addToCart(item, q);
                }
            };
            btn.addEventListener('mousedown', () => rec.start());
            btn.addEventListener('mouseup', () => rec.stop());
        }

        document.getElementById('navBizName').innerText = biz.name;
        renderCategoryTabs(); renderPOS();
    </script>
</body>
</html>
