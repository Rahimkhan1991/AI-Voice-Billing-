<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing - AI POS Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }
        .mic-active { animation: pulse 1s infinite; background: #ef4444 !important; scale: 1.05; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        .hide-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col">

    <nav class="bg-slate-900 text-white p-4 flex justify-between items-center shadow-xl shrink-0">
        <div class="flex items-center gap-3 font-black italic">
            <i class="fa-solid fa-microphone-lines text-indigo-500 text-xl"></i> AI-POS PRO
        </div>
        <div class="flex gap-6 text-[10px] font-black uppercase tracking-widest">
            <a href="dashboard.html" class="opacity-50 hover:opacity-100 transition">Dashboard</a>
            <a href="billing.html" class="text-indigo-400">Billing</a>
            <a href="inventory.html" class="opacity-50 hover:opacity-100 transition">Inventory</a>
        </div>
    </nav>

    <main class="flex-grow flex overflow-hidden">
        
        <section class="flex-grow flex flex-col p-6 overflow-hidden">
            <div class="flex gap-2 mb-6 overflow-x-auto hide-scroll shrink-0" id="catTabs"></div>

            <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4 overflow-y-auto pr-2" id="posGrid">
                </div>
        </section>

        <aside class="w-[400px] bg-white border-l border-slate-200 flex flex-col shadow-2xl">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-white sticky top-0">
                <h2 class="font-black text-slate-800 text-xs uppercase tracking-widest">Live Receipt</h2>
                <button onclick="clearCart()" class="text-red-500 text-[10px] font-black uppercase">Clear</button>
            </div>

            <div class="flex-grow overflow-y-auto p-4 space-y-3" id="cartItems">
                </div>

            <div class="p-6 bg-slate-50 border-t border-slate-100 space-y-4">
                <div class="bg-slate-900 rounded-3xl p-6 text-center text-white shadow-xl relative overflow-hidden group">
                    <button id="micBtn" class="w-16 h-16 rounded-full bg-indigo-600 flex items-center justify-center mx-auto mb-2 transition-all active:scale-90 touch-none">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                    <p id="micText" class="text-[10px] font-black uppercase tracking-tighter opacity-60">Hold to Speak</p>
                </div>

                <div class="flex justify-between items-end">
                    <div>
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Total Amount</p>
                        <h2 class="text-4xl font-black text-slate-900 leading-none">$<span id="grandTotal">0.00</span></h2>
                    </div>
                    <button onclick="window.print()" class="bg-indigo-600 text-white w-14 h-14 rounded-2xl flex items-center justify-center shadow-lg hover:bg-indigo-700 transition">
                        <i class="fa-solid fa-print"></i>
                    </button>
                </div>
            </div>
        </aside>
    </main>

    <script>
        // --- DATA LOAD ---
        let inventory = JSON.parse(localStorage.getItem('AI_POS_INVENTORY')) || [];
        let cart = [];
        let activeCat = "All";

        // --- RENDER POS ---
        function renderPOS() {
            const grid = document.getElementById('posGrid');
            const tabs = document.getElementById('catTabs');
            const cats = ["All", "Fruits", "Vegetables", "Dairy", "Meat", "Fish", "Grains", "Other"];
            
            tabs.innerHTML = cats.map(c => `
                <button onclick="activeCat='${c}'; renderPOS()" class="px-5 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest transition whitespace-nowrap ${activeCat == c ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-200' : 'bg-white text-slate-400 hover:bg-slate-50'}">
                    ${c}
                </button>
            `).join('');

            const items = activeCat == "All" ? inventory : inventory.filter(p => p.cat == activeCat);
            grid.innerHTML = items.map(p => `
                <div onclick="addToCart(${p.id})" class="bg-white rounded-3xl p-4 border border-slate-100 shadow-sm hover:shadow-xl hover:-translate-y-1 transition cursor-pointer group">
                    <img src="${p.img || 'https://source.unsplash.com/featured/?'+p.name}" class="w-full h-28 object-cover rounded-2xl mb-3">
                    <h3 class="font-bold text-slate-800 text-sm capitalize">${p.name}</h3>
                    <p class="text-indigo-600 font-black text-xs mt-1">$${p.price.toFixed(2)} / ${p.unit}</p>
                </div>
            `).join('');
        }

        // --- CART LOGIC ---
        function addToCart(id, qty = 1) {
            const p = inventory.find(item => item.id == id);
            const exists = cart.find(c => c.id == id);
            if(exists) exists.qty += qty;
            else cart.push({ ...p, qty });
            updateCart();
        }

        function updateCart() {
            const container = document.getElementById('cartItems');
            let total = 0;
            container.innerHTML = cart.map((item, idx) => {
                const sub = item.qty * item.price;
                total += sub;
                return `
                    <div class="bg-white p-3 rounded-2xl border border-slate-100 flex items-center justify-between group">
                        <div class="flex-grow">
                            <p class="font-bold text-slate-800 text-xs capitalize">${item.name}</p>
                            <p class="text-[9px] font-bold text-slate-400 uppercase">${item.qty} ${item.unit} x $${item.price}</p>
                        </div>
                        <p class="font-black text-indigo-600 text-sm">$${sub.toFixed(2)}</p>
                        <button onclick="cart.splice(${idx},1); updateCart()" class="ml-2 text-slate-200 hover:text-red-500"><i class="fa-solid fa-circle-xmark"></i></button>
                    </div>
                `;
            }).join('');
            document.getElementById('grandTotal').innerText = total.toFixed(2);
        }

        function clearCart() { cart = []; updateCart(); }

        // --- VOICE ENGINE ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(SpeechRecognition) {
            const recognition = new SpeechRecognition();
            const btn = document.getElementById('micBtn');
            const txt = document.getElementById('micText');

            recognition.onstart = () => { btn.classList.add('mic-active'); txt.innerText = "Listening..."; };
            recognition.onend = () => { btn.classList.remove('mic-active'); txt.innerText = "Hold to Speak"; };
            recognition.onresult = (e) => processVoice(e.results[0][0].transcript.toLowerCase());

            btn.addEventListener('mousedown', () => recognition.start());
            btn.addEventListener('mouseup', () => recognition.stop());
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); recognition.start(); });
            btn.addEventListener('touchend', () => recognition.stop());
        }

        function processVoice(text) {
            // Regex for multi-items "Add 2kg Apple and 1 Milk"
            const parts = text.split('and');
            parts.forEach(p => {
                const match = p.match(/(\d+(?:\.\d+)?|half|quarter)?\s*(kg|g|nos|pack|bottle)?\s*(\w+)/i);
                if(match) {
                    let qty = parseFloat(match[1]) || 1;
                    if(match[1] === 'half') qty = 0.5;
                    let name = match[3];
                    const item = inventory.find(i => name.includes(i.name.toLowerCase()) || i.name.toLowerCase().includes(name));
                    if(item) {
                        addToCart(item.id, qty);
                        speak(`Added ${qty} ${item.name}`);
                    }
                }
            });
        }

        function speak(m) {
            const u = new SpeechSynthesisUtterance(m);
            u.rate = 1.1;
            window.speechSynthesis.speak(u);
        }

        renderPOS();
    </script>
</body>
</html>
