<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Reports - AI POS Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .hide-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen">

    <nav class="bg-slate-900 text-white p-5 flex justify-between items-center shadow-xl sticky top-0 z-50">
        <div class="flex items-center gap-3 font-black italic text-xl">
            <i class="fa-solid fa-chart-line text-indigo-500 text-2xl"></i> <span id="navBizName">AI-POS PRO</span>
        </div>
        <div class="flex gap-8 text-[10px] font-black uppercase tracking-widest">
            <a href="dashboard.html" class="opacity-60 hover:opacity-100 transition">Dashboard</a>
            <a href="billing.html" class="opacity-60 hover:opacity-100 transition">Billing</a>
            <a href="inventory.html" class="opacity-60 hover:opacity-100 transition">Inventory</a>
            <a href="reports.html" class="text-indigo-400">Reports</a>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-8 space-y-8">
        
        <div class="flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-3xl font-black text-slate-800 uppercase tracking-tight">Sales Analytics</h1>
                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mt-1">Detailed performance tracking</p>
            </div>
            <button onclick="exportToExcel()" class="bg-indigo-600 text-white px-6 py-3 rounded-2xl font-black text-xs shadow-lg hover:bg-indigo-700 transition flex items-center gap-2">
                <i class="fa-solid fa-file-export"></i> EXPORT CSV
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-2">Total Revenue</p>
                <h2 id="totalRevenue" class="text-3xl font-black text-slate-800">0</h2>
                <div class="mt-4 flex items-center gap-2 text-emerald-500 text-[10px] font-black">
                    <i class="fa-solid fa-arrow-up"></i> LIVE SALES
                </div>
            </div>

            <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-2">Total Profit</p>
                <h2 id="totalProfit" class="text-3xl font-black text-indigo-600">0</h2>
                <div class="mt-4 flex items-center gap-2 text-indigo-400 text-[10px] font-black uppercase">
                    Calculated from purchase price
                </div>
            </div>

            <div class="bg-slate-900 p-8 rounded-[2.5rem] shadow-xl text-white">
                <p class="text-[10px] font-black opacity-50 uppercase tracking-[0.2em] mb-2">Transactions</p>
                <h2 id="totalOrders" class="text-3xl font-black">0</h2>
                <div class="mt-4 flex items-center gap-2 text-indigo-400 text-[10px] font-black uppercase">
                    Processed successfully
                </div>
            </div>
        </div>

        <div class="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden">
            <div class="p-8 border-b border-slate-50 flex justify-between items-center">
                <h2 class="text-xl font-black text-slate-800 uppercase tracking-tight text-xs">Recent Transactions</h2>
                <div class="flex gap-2">
                    <input type="text" id="reportSearch" onkeyup="renderReportTable(this.value)" placeholder="Search Invoice No..." class="px-5 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs w-56 focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-slate-50">
                        <tr class="text-[10px] font-black text-slate-400 uppercase tracking-widest border-b">
                            <th class="px-8 py-4">Invoice & Date</th>
                            <th class="px-8 py-4">Method</th>
                            <th class="px-8 py-4">Revenue</th>
                            <th class="px-8 py-4">Profit</th>
                            <th class="px-8 py-4 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="salesList" class="divide-y divide-slate-50 text-sm font-medium"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // --- DATA LOAD ---
        const biz = JSON.parse(localStorage.getItem('AI_POS_BIZ_DATA')) || { name: "AI POS", locale: "id-ID", symbol: "Rp", currencyCode: "IDR" };
        let sales = JSON.parse(localStorage.getItem('AI_POS_SALES')) || [];

        // --- MONEY FORMATTER ---
        function formatMoney(amount) {
            return new Intl.NumberFormat(biz.locale, {
                style: 'currency',
                currency: biz.currencyCode !== 'CUSTOM' ? biz.currencyCode : 'USD',
                maximumFractionDigits: (biz.locale === 'id-ID' || biz.currencyCode === 'IDR') ? 0 : 2
            }).format(amount).replace('USD', biz.symbol);
        }

        // --- CALCULATION LOGIC ---
        function calculateSummary() {
            const revenue = sales.reduce((acc, tx) => acc + (parseFloat(tx.total) || 0), 0);
            const profit = sales.reduce((acc, tx) => acc + (parseFloat(tx.profit) || 0), 0);

            document.getElementById('totalRevenue').innerText = formatMoney(revenue);
            document.getElementById('totalProfit').innerText = formatMoney(profit);
            document.getElementById('totalOrders').innerText = sales.length;
        }

        // --- RENDER TABLE ---
        function renderReportTable(filter = "") {
            const list = document.getElementById('salesList');
            const data = filter ? sales.filter(s => s.invoiceNo.toLowerCase().includes(filter.toLowerCase())) : sales;
            
            // Sort by latest transaction first
            const sortedData = [...data].reverse();

            list.innerHTML = sortedData.map(s => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="px-8 py-5">
                        <p class="font-bold text-slate-800 uppercase text-xs">${s.invoiceNo}</p>
                        <p class="text-[9px] font-black text-slate-400 uppercase">${s.date}</p>
                    </td>
                    <td class="px-8 py-5">
                        <span class="text-[9px] font-black px-3 py-1 rounded-full ${s.payment === 'CASH' ? 'bg-emerald-100 text-emerald-600' : 'bg-indigo-100 text-indigo-600'}">
                            ${s.payment}
                        </span>
                    </td>
                    <td class="px-8 py-5 font-black text-slate-800">${formatMoney(s.total)}</td>
                    <td class="px-8 py-5 font-black text-indigo-500">${formatMoney(s.profit)}</td>
                    <td class="px-8 py-5 text-right">
                        <button onclick="reprintInvoice('${s.invoiceNo}')" class="text-slate-300 hover:text-indigo-600 transition p-2">
                            <i class="fa-solid fa-print"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function reprintInvoice(invNo) {
            const tx = sales.find(s => s.invoiceNo === invNo);
            if (!tx) return;
            
            // Re-using the 58mm Thermal Print Logic
            const win = window.open('', '', 'width=300,height=600');
            let rows = tx.items.map(i => `<div style="display:flex;justify-content:space-between;font-size:11px;"><span>${i.name.toUpperCase()} x${i.qty}</span><span>${(i.qty*i.price).toLocaleString()}</span></div>`).join('');
            win.document.write(`<html><style>@page{size:58mm auto;margin:0;}body{width:58mm;padding:4mm;font-family:monospace;font-size:11px;}.center{text-align:center;}.line{border-top:1px dashed #000;margin:5px 0;}</style>
            <body onload="window.print();window.close()"><div class="center"><h2 style="margin:0;">REPRINT: ${biz.name}</h2></div><div class="line"></div>
            <p>INV: ${tx.invoiceNo}<br>Date: ${tx.date}</p><div class="line"></div>${rows}<div class="line"></div>
            <div style="display:flex;justify-content:space-between;font-weight:bold;"><span>TOTAL</span><span>${biz.symbol}${tx.total.toLocaleString()}</span></div>
            <p>Payment: ${tx.payment}</p><div class="line"></div><p class="center">THANK YOU!</p></body></html>`);
            win.document.close();
        }

        function exportToExcel() {
            if (sales.length === 0) return alert("No sales to export!");
            
            let csvContent = "data:text/csv;charset=utf-8,Invoice No,Date,Payment Method,Total Revenue,Profit\n";
            sales.forEach(s => {
                csvContent += `${s.invoiceNo},${s.date},${s.payment},${s.total},${s.profit}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `sales_report_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        document.getElementById('navBizName').innerText = biz.name;
        calculateSummary();
        renderReportTable();
    </script>
</body>
</html>
