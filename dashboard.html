<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-POS PRO | Enterprise Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .sidebar-item:hover { background: rgba(79, 70, 229, 0.1); color: #4f46e5; }
        .sidebar-active { background: #4f46e5; color: white !important; box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4); }
    </style>
</head>
<body class="min-h-screen flex">

    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col fixed h-full z-50">
        <div class="p-6">
            <div class="flex items-center gap-3 font-black italic text-xl text-slate-800">
                <i class="fa-solid fa-gauge-high text-indigo-600"></i> AI-POS <span class="text-indigo-600">PRO</span>
            </div>
        </div>

        <nav class="flex-grow px-4 space-y-2">
            <a href="dashboard.html" class="sidebar-active flex items-center gap-4 px-4 py-3 rounded-xl font-bold transition">
                <i class="fa-solid fa-house-chimney w-5"></i> Dashboard
            </a>
            <a href="billing.html" class="sidebar-item text-slate-500 flex items-center gap-4 px-4 py-3 rounded-xl font-bold transition">
                <i class="fa-solid fa-receipt w-5"></i> Billing POS
            </a>
            <a href="inventory.html" class="sidebar-item text-slate-500 flex items-center gap-4 px-4 py-3 rounded-xl font-bold transition">
                <i class="fa-solid fa-boxes-stacked w-5"></i> Inventory
            </a>
            <a href="reports.html" class="sidebar-item text-slate-500 flex items-center gap-4 px-4 py-3 rounded-xl font-bold transition">
                <i class="fa-solid fa-chart-pie w-5"></i> Sales Reports
            </a>
        </nav>

        <div class="p-4 border-t border-slate-100">
            <a href="setup.html?edit=true" class="sidebar-item text-slate-500 flex items-center gap-4 px-4 py-3 rounded-xl font-bold transition">
                <i class="fa-solid fa-gears w-5"></i> Settings
            </a>
        </div>
    </aside>

    <main class="flex-grow ml-64 p-8">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-3xl font-black text-slate-800 tracking-tight" id="welcomeMsg">Hello!</h1>
                <p class="text-slate-500 font-medium italic" id="displayIndustry">Store Management</p>
            </div>
            <button onclick="initDashboard()" class="p-3 bg-white border rounded-xl hover:bg-slate-50 text-indigo-600 shadow-sm">
                <i class="fa-solid fa-rotate"></i>
            </button>
        </header>

        <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
            <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100 text-center md:text-left">
                <div class="flex justify-between items-start mb-4">
                    <div class="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-lg"><i class="fa-solid fa-cash-register"></i></div>
                    <span class="text-[10px] font-black text-emerald-500 bg-emerald-50 px-2 py-1 rounded-md">LIVE</span>
                </div>
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Total Revenue</p>
                <h2 id="statRevenue" class="text-2xl font-black text-slate-800">0</h2>
            </div>

            <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100 text-center md:text-left">
                <div class="flex justify-between items-start mb-4">
                    <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg"><i class="fa-solid fa-hand-holding-dollar"></i></div>
                    <span class="text-[10px] font-black text-indigo-500 bg-indigo-50 px-2 py-1 rounded-md">NET</span>
                </div>
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Total Net Profit</p>
                <h2 id="statProfit" class="text-2xl font-black text-slate-800">0</h2>
            </div>

            <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100 text-center md:text-left">
                <div class="flex justify-between items-start mb-4">
                    <div class="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-lg"><i class="fa-solid fa-boxes-stacked"></i></div>
                </div>
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Items In Stock</p>
                <h2 id="statItems" class="text-2xl font-black text-slate-800">0</h2>
            </div>

            <div class="bg-slate-900 p-6 rounded-[2rem] shadow-xl text-white text-center md:text-left">
                <div class="flex justify-between items-start mb-4">
                    <div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center text-lg border border-white/20"><i class="fa-solid fa-wallet"></i></div>
                </div>
                <p class="text-[10px] font-black opacity-50 uppercase tracking-widest">Stock Asset Value</p>
                <h2 id="statValue" class="text-2xl font-black text-white">0</h2>
            </div>
        </section>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm">
                <h3 class="text-sm font-black text-slate-800 uppercase mb-4"><i class="fa-solid fa-bell text-amber-500 mr-2"></i> Stock Alerts</h3>
                <div id="lowStockAlert" class="space-y-3"></div>
            </div>
            
            <div class="bg-indigo-600 p-8 rounded-[2.5rem] text-white shadow-xl relative overflow-hidden group">
                <h3 class="text-xl font-black mb-2 relative z-10">Quick Actions</h3>
                <p class="text-indigo-100 text-xs mb-6 relative z-10">Jump to POS terminal or check history.</p>
                <div class="flex gap-4 relative z-10">
                    <a href="billing.html" class="bg-white text-indigo-600 px-4 py-2 rounded-xl font-black text-[10px] uppercase">New Bill</a>
                    <a href="reports.html" class="bg-indigo-500 text-white px-4 py-2 rounded-xl font-black text-[10px] uppercase border border-indigo-400">Full Reports</a>
                </div>
            </div>
        </div>
    </main>

    <script>
    // --- 1. UNIVERSAL DATA FETCHING ---
    function initDashboard() {
        console.log("Syncing Dashboard Data...");

        // Fetch Raw Data
        const bizRaw = localStorage.getItem('AI_POS_BIZ_DATA');
        const invRaw = localStorage.getItem('AI_POS_INVENTORY');
        const salesRaw = localStorage.getItem('AI_POS_SALES');

        // Parse with Fallbacks
        const biz = bizRaw ? JSON.parse(bizRaw) : { name: "Store", locale: "id-ID", symbol: "Rp", currencyCode: "IDR" };
        const inventory = invRaw ? JSON.parse(invRaw) : [];
        const sales = salesRaw ? JSON.parse(salesRaw) : [];

        // --- 2. MONEY FORMATTER ---
        const formatMoney = (amount) => {
            return new Intl.NumberFormat(biz.locale, {
                style: 'currency',
                currency: biz.currencyCode !== 'CUSTOM' ? biz.currencyCode : 'USD',
                maximumFractionDigits: (biz.locale === 'id-ID' || biz.currencyCode === 'IDR') ? 0 : 2
            }).format(amount).replace('USD', biz.symbol);
        };

        // --- 3. UI BRANDING ---
        document.getElementById('navBizName').innerText = biz.name || "AI-POS PRO";
        document.getElementById('welcomeMsg').innerText = `Hello, ${biz.name || 'User'}!`;
        document.getElementById('displayIndustry').innerText = biz.industry || "General Retail";
        if(document.getElementById('bizDetailsDisplay')) {
            document.getElementById('bizDetailsDisplay').innerText = biz.address || 'Address not set';
        }

        // --- 4. CALCULATION ENGINE (WITH STRICT PARSING) ---
        
        // REVENUE: Sum of all 'total' fields in sales
        const revenue = sales.reduce((acc, tx) => acc + (parseFloat(tx.total) || 0), 0);
        document.getElementById('statRevenue').innerText = formatMoney(revenue);

        // PROFIT: Sum of all 'profit' fields in sales
        const profit = sales.reduce((acc, tx) => acc + (parseFloat(tx.profit) || 0), 0);
        document.getElementById('statProfit').innerText = formatMoney(profit);

        // INVENTORY COUNT: Number of unique items
        document.getElementById('statItems').innerText = inventory.length;

        // ASSET VALUE: Sum of (Purchase Price * Stock)
        const assetValue = inventory.reduce((acc, item) => {
            const pPrice = parseFloat(item.purchasePrice) || 0;
            const sQty = parseFloat(item.stock) || 0;
            return acc + (pPrice * sQty);
        }, 0);
        document.getElementById('statValue').innerText = formatMoney(assetValue);

        // --- 5. STOCK ALERTS ---
        const alertBox = document.getElementById('lowStockAlert');
        const lowStockItems = inventory.filter(p => (parseFloat(p.stock) || 0) < 5);
        
        if (alertBox) {
            if (lowStockItems.length > 0) {
                alertBox.innerHTML = lowStockItems.map(p => `
                    <div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl border border-slate-100">
                        <span class="text-xs font-bold text-slate-700">${p.name}</span>
                        <span class="text-[10px] font-black text-red-500 uppercase">${p.stock} Left</span>
                    </div>
                `).join('');
            } else {
                alertBox.innerHTML = `<p class="text-xs text-slate-400 italic text-center">Stock is healthy.</p>`;
            }
        }
    }

    // Run when page is fully loaded
    window.addEventListener('load', initDashboard);
</script>
</body>
</html>
