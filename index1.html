<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStore AI - Hybrid POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }
        .mic-active { animation: pulse 1s infinite; background: #ef4444 !important; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        .hide-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col">

    <header class="bg-white border-b border-slate-200 px-6 py-3 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 p-2 rounded-xl text-white"><i class="fa-solid fa-robot"></i></div>
            <h1 class="text-xl font-bold text-slate-800">SmartPOS <span class="text-indigo-600">AI</span></h1>
        </div>
        <div class="flex items-center gap-4">
            <div id="status" class="text-[10px] font-bold px-3 py-1 rounded-full bg-green-100 text-green-600 tracking-widest uppercase">● System Online</div>
            <button onclick="toggleManager()" class="bg-slate-100 p-2 rounded-lg text-slate-600 hover:bg-slate-200"><i class="fa-solid fa-gear"></i></button>
        </div>
    </header>

    <main class="flex-grow flex overflow-hidden">
        
        <section class="flex-grow flex flex-col p-6 overflow-hidden">
            <div class="flex gap-2 mb-6 overflow-x-auto hide-scroll shrink-0" id="categoryTabs">
                </div>

            <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4 overflow-y-auto pr-2 custom-scroll" id="productGrid">
                </div>
        </section>

        <aside class="w-[400px] bg-white border-l border-slate-200 flex flex-col shadow-2xl z-10">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <h2 class="font-bold text-slate-800 uppercase tracking-widest text-xs">Current Invoice</h2>
                <button onclick="clearCart()" class="text-red-500 text-[10px] font-black uppercase tracking-tighter hover:underline">Empty Cart</button>
            </div>

            <div class="flex-grow overflow-y-auto p-4 space-y-3" id="cartContainer">
                </div>

            <div class="p-6 bg-slate-50 space-y-4">
                <div class="bg-slate-900 rounded-3xl p-6 text-center text-white relative shadow-xl overflow-hidden">
                    <button id="micBtn" class="w-20 h-20 rounded-full bg-indigo-600 flex items-center justify-center mx-auto mb-3 transition-all">
                        <i class="fa-solid fa-microphone text-2xl"></i>
                    </button>
                    <p id="instruction" class="text-xs font-medium opacity-80 italic">Hold to use Voice</p>
                </div>

                <div class="flex justify-between items-end px-2">
                    <div>
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Grand Total</p>
                        <h2 class="text-4xl font-black text-slate-900">$<span id="grandTotal">0.00</span></h2>
                    </div>
                    <button onclick="window.print()" class="bg-indigo-600 text-white p-4 rounded-2xl shadow-lg hover:bg-indigo-700 transition">
                        <i class="fa-solid fa-receipt text-xl"></i>
                    </button>
                </div>
            </div>
        </aside>
    </main>

    <div id="managerModal" class="fixed inset-0 bg-slate-900/50 hidden items-center justify-center p-6 z-50 backdrop-blur-sm">
        <div class="bg-white rounded-3xl w-full max-w-md p-8 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">Manage Inventory</h2>
                <button onclick="toggleManager()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-4">
                <input type="text" id="dbName" placeholder="Product Name" class="w-full px-4 py-3 rounded-xl bg-slate-50 border-none outline-indigo-500">
                <div class="flex gap-2">
                    <input type="number" id="dbPrice" placeholder="Price" class="w-1/2 px-4 py-3 rounded-xl bg-slate-50 border-none outline-indigo-500">
                    <select id="dbCategory" class="w-1/2 px-4 py-3 rounded-xl bg-slate-50 border-none outline-indigo-500">
                        <option>Fruits</option><option>Vegetables</option><option>Dairy</option><option>Meat</option><option>Fish</option><option>Grains</option><option>Other</option>
                    </select>
                </div>
                <input type="text" id="dbImg" placeholder="Image URL (Optional)" class="w-full px-4 py-3 rounded-xl bg-slate-50 border-none outline-indigo-500">
                <button onclick="saveToDB()" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold">Add Product</button>
            </div>
            <div class="mt-8 pt-8 border-t max-h-48 overflow-y-auto" id="inventoryList"></div>
        </div>
    </div>

    <script>
        // --- DATA & STATE ---
        let products = JSON.parse(localStorage.getItem('hybridPOS_DB')) || [
            { name: "Apple", price: 2.5, cat: "Fruits", img: "" },
            { name: "Milk", price: 1.8, cat: "Dairy", img: "" },
            { name: "Fish", price: 12.0, cat: "Fish", img: "" },
            { name: "Carrot", price: 0.8, cat: "Vegetables", img: "" }
        ];
        let cart = [];
        let currentCat = "All";
        const categories = ["All", "Fruits", "Vegetables", "Dairy", "Meat", "Fish", "Grains", "Other"];

        // --- UI RENDERING ---
        function renderCategories() {
            const container = document.getElementById('categoryTabs');
            container.innerHTML = categories.map(cat => `
                <button onclick="setCategory('${cat}')" class="px-6 py-2 rounded-full font-bold text-sm whitespace-nowrap transition ${currentCat === cat ? 'bg-indigo-600 text-white shadow-lg' : 'bg-white text-slate-500 hover:bg-slate-50'}">
                    ${cat}
                </button>
            `).join('');
        }

        function renderProducts() {
            const container = document.getElementById('productGrid');
            const filtered = currentCat === "All" ? products : products.filter(p => p.cat === currentCat);
            
            container.innerHTML = filtered.map(p => {
                const imgURL = p.img || `https://source.unsplash.com/featured/?${p.name}`;
                return `
                <div onclick="addToCart('${p.name}')" class="bg-white rounded-[2rem] p-4 shadow-sm border border-slate-100 hover:shadow-xl hover:-translate-y-1 transition cursor-pointer group relative overflow-hidden">
                    <img src="${imgURL}" class="w-full h-32 object-cover rounded-2xl mb-3" onerror="this.src='https://via.placeholder.com/150?text=Product'">
                    <h3 class="font-bold text-slate-800 capitalize">${p.name}</h3>
                    <div class="flex justify-between items-center mt-1">
                        <span class="text-indigo-600 font-black">$${p.price.toFixed(2)}</span>
                        <span class="text-[9px] font-bold text-slate-300 uppercase">${p.cat}</span>
                    </div>
                </div>
                `;
            }).join('');
        }

        function renderCart() {
            const container = document.getElementById('cartContainer');
            const totalDisplay = document.getElementById('grandTotal');
            container.innerHTML = '';
            let total = 0;

            cart.forEach((item, index) => {
                total += item.price * item.qty;
                container.innerHTML += `
                <div class="flex items-center gap-3 bg-slate-50 p-3 rounded-2xl border border-slate-100">
                    <div class="flex-grow">
                        <p class="font-bold text-slate-800 capitalize text-sm">${item.name}</p>
                        <p class="text-[10px] text-slate-400 font-bold">$${item.price.toFixed(2)} x ${item.qty}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="adjustQty(${index}, -1)" class="w-6 h-6 rounded-lg bg-white shadow-sm flex items-center justify-center text-xs">-</button>
                        <span class="text-xs font-black">${item.qty}</span>
                        <button onclick="adjustQty(${index}, 1)" class="w-6 h-6 rounded-lg bg-white shadow-sm flex items-center justify-center text-xs">+</button>
                    </div>
                    <button onclick="removeFromCart(${index})" class="text-slate-300 hover:text-red-500 ml-2"><i class="fa-solid fa-trash-can text-xs"></i></button>
                </div>
                `;
            });
            totalDisplay.innerText = total.toFixed(2);
        }

        // --- CART LOGIC ---
        function addToCart(name, qty = 1) {
            const product = products.find(p => p.name.toLowerCase() === name.toLowerCase());
            if (product) {
                const existing = cart.find(item => item.name.toLowerCase() === name.toLowerCase());
                if (existing) existing.qty += qty;
                else cart.push({ ...product, qty });
                renderCart();
            }
        }

        function adjustQty(index, amt) {
            cart[index].qty += amt;
            if (cart[index].qty <= 0) cart.splice(index, 1);
            renderCart();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            renderCart();
        }

        function clearCart() { cart = []; renderCart(); }

        function setCategory(cat) { currentCat = cat; renderCategories(); renderProducts(); }

        // --- DATABASE MANAGEMENT ---
        function toggleManager() {
            const modal = document.getElementById('managerModal');
            modal.classList.toggle('hidden');
            modal.classList.toggle('flex');
            renderInventoryList();
        }

        function saveToDB() {
            const name = document.getElementById('dbName').value;
            const price = parseFloat(document.getElementById('dbPrice').value);
            const cat = document.getElementById('dbCategory').value;
            const img = document.getElementById('dbImg').value;

            if (name && price) {
                const idx = products.findIndex(p => p.name.toLowerCase() === name.toLowerCase());
                if(idx > -1) products[idx] = { name, price, cat, img };
                else products.push({ name, price, cat, img });
                
                localStorage.setItem('hybridPOS_DB', JSON.stringify(products));
                renderProducts();
                renderInventoryList();
                document.getElementById('dbName').value = '';
                document.getElementById('dbPrice').value = '';
            }
        }

        function renderInventoryList() {
            const list = document.getElementById('inventoryList');
            list.innerHTML = products.map(p => `
                <div class="flex justify-between items-center py-2 border-b">
                    <div>
                        <p class="font-bold text-sm capitalize">${p.name}</p>
                        <p class="text-[10px] text-slate-400">$${p.price} - ${p.cat}</p>
                    </div>
                    <button onclick="deleteProduct('${p.name}')" class="text-red-400 hover:text-red-600 text-xs"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');
        }

        function deleteProduct(name) {
            products = products.filter(p => p.name !== name);
            localStorage.setItem('hybridPOS_DB', JSON.stringify(products));
            renderProducts();
            renderInventoryList();
        }

        // --- SPEECH RECOGNITION (YOUR CORE FEATURE) ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'en-US';

            const micBtn = document.getElementById('micBtn');
            micBtn.addEventListener('mousedown', () => recognition.start());
            micBtn.addEventListener('mouseup', () => recognition.stop());
            micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); recognition.start(); });
            micBtn.addEventListener('touchend', () => recognition.stop());

            recognition.onstart = () => {
                micBtn.classList.add('mic-active');
                document.getElementById('instruction').innerText = "System Listening...";
            };

            recognition.onend = () => {
                micBtn.classList.remove('mic-active');
                document.getElementById('instruction').innerText = "Hold to use Voice";
            };

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript.toLowerCase();
                document.getElementById('instruction').innerText = `Heard: "${text}"`;
                processVoice(text);
            };
        }

        function processVoice(text) {
            const parts = text.split(/and|,|\+/);
            parts.forEach(part => {
                const cleanPart = part.trim();
                const regex = /(\d+(?:\/\d+|\.\d+)?|half|quarter)?\s*(kg|kilo|gram|g|pkt|pc|unit|bottle)?\s*(\w+)/i;
                const match = cleanPart.match(regex);

                if (match) {
                    let rawQty = match[1] || "1";
                    let unit = match[2] || 'unit';
                    let itemName = match[3] ? match[3].toLowerCase() : "";

                    let qty = 0;
                    if (rawQty === 'half') qty = 0.5;
                    else if (rawQty === 'quarter') qty = 0.25;
                    else qty = parseFloat(rawQty);

                    let calcQty = qty;
                    if (unit === 'gram' || unit === 'g') calcQty = qty / 1000;

                    const product = products.find(p => itemName.includes(p.name.toLowerCase()) || p.name.toLowerCase().includes(itemName));
                    if (product) {
                        addToCart(product.name, calcQty);
                        speak(`Added ${rawQty} ${itemName}`);
                    }
                }
            });
        }

        function speak(m) {
            const u = new SpeechSynthesisUtterance(m);
            u.rate = 1.1;
            window.speechSynthesis.speak(u);
        }

        // Initial Boot
        renderCategories();
        renderProducts();
    </script>
</body>
</html>
